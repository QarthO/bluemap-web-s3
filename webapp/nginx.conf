server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /settings.json {
        include /etc/nginx/bluemap-settings.conf;
        add_header Cache-Control "no-store";
    }

    # Legacy clients (including MapLink) assume map data lives under /maps/.
    # Match live data first so installations with separate roots work too.
    location ~ ^/maps/([^/]+/live/.*)$ {
        include /etc/nginx/bluemap-live.conf;
    }

    location ~ ^/maps/(.*)$ {
        include /etc/nginx/bluemap-maps.conf;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
