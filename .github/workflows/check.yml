name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f addon/pom.xml verify
      - run: docker build -t bluemap-web ./webapp
      - run: docker compose config --quiet
      - name: Name jar with commit SHA
        id: jar
        run: |
          artifact_path="addon/target/bluemap-s3-$(git rev-parse --short=7 HEAD).jar"
          mv addon/target/bluemap-s3-*.jar "$artifact_path"
          echo "path=$artifact_path" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.jar.outputs.path }}
          archive: false
          if-no-files-found: error
